name: Handbook checks

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  handbook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Install pinned development dependency
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install -r requirements-dev.txt
      - name: Test handbook examples and real hooks
        run: .venv/bin/python -m unittest discover -s tests -v
      - name: Validate PR title and commit messages
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          printf '%s\n' "$PR_TITLE" | python3 scripts/check_commit.py --stdin
          python3 scripts/check_commit.py --range "$BASE_SHA..$HEAD_SHA"
          git diff --check "$BASE_SHA" "$HEAD_SHA"
      - name: Validate main commit and generate changelog
        if: github.event_name == 'push'
        run: |
          python3 scripts/check_commit.py --range HEAD~1..HEAD
          python3 scripts/changelog.py --output CHANGELOG.md
